[package]
name = "oxide-test"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Standalone public challenge tester for Oxide Club"
license = "MIT"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
